name: Bug Report
description: Report a bug in one of the scripts
labels: ["bug"]
body:
  - type: input
    id: script
    attributes:
      label: Script
      placeholder: scripts/snapshot/create-snapshot.sh
    validations:
      required: true
  - type: input
    id: es-version
    attributes:
      label: Elasticsearch version
      placeholder: "9.5.4"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run: ./scripts/snapshot/create-snapshot.sh -r repo -s snap
        2. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
